<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pill Counter</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 680px;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 1.5rem;
    }

    /* Controls & Upload Area */
    .upload-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .file-input-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      padding: 2rem 1rem;
      background-color: #f1f5f9;
      cursor: pointer;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .file-input-wrapper:hover {
      border-color: var(--primary-color);
      background-color: #eff6ff;
    }

    .file-input-wrapper input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .upload-placeholder {
      text-align: center;
      color: var(--text-muted);
      pointer-events: none;
    }

    .upload-placeholder span {
      display: block;
      font-weight: 600;
      color: var(--text-main);
      margin-top: 0.5rem;
    }

    .btn {
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    /* Status & Pill Count Display */
    .status-badge {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: none;
    }

    .status-badge.loading {
      display: block;
      background-color: #e0f2fe;
      color: #0369a1;
    }

    .status-badge.success {
      display: block;
      background-color: #dcfce7;
      color: #15803d;
    }

    .status-badge.error {
      display: block;
      background-color: #fee2e2;
      color: #b91c1c;
    }

    /* Image & Overlay Canvas Container */
    .canvas-container {
      position: relative;
      width: 100%;
      display: none;
      justify-content: center;
      align-items: center;
      background-color: #000000;
      border-radius: 12px;
      overflow: hidden;
    }

    #preview-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    #boxes-canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none; /* Allows user to press-and-hold image on mobile */
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>YOLO26 Pill Counter</h1>
    <p class="subtitle">Upload or capture a photo to automatically count pills</p>

    <div class="upload-section">
      <div class="file-input-wrapper">
        <input type="file" id="file-input" accept="image/*" />
        <div class="upload-placeholder" id="upload-label">
          📁 <span>Choose an image or take a photo</span>
        </div>
      </div>
      <button class="btn" id="submit-btn" disabled>Start Counting</button>
    </div>

    <!-- Status Output -->
    <div class="status-badge" id="status-badge"></div>

    <!-- Canvas Preview Container -->
    <div class="canvas-container" id="canvas-container">
      <img id="preview-img" alt="Pill preview" />
      <canvas id="boxes-canvas"></canvas>
    </div>
  </div>

  <script>
    // =========================================================================
    // CONFIGURATION
    // Replace this URL with your live deployed Render API URL
    // =========================================================================
    const API_URL = "https://your-render-app.onrender.com/count";

    // DOM Elements
    const fileInput = document.getElementById("file-input");
    const uploadLabel = document.getElementById("upload-label");
    const submitBtn = document.getElementById("submit-btn");
    const statusBadge = document.getElementById("status-badge");
    const canvasContainer = document.getElementById("canvas-container");
    const previewImg = document.getElementById("preview-img");
    const canvas = document.getElementById("boxes-canvas");

    // Global variable to store last API response for window resize redraws
    let lastDetectionData = null;

    // 1. Handle File Selection
    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      uploadLabel.querySelector("span").textContent = file.name;
      submitBtn.disabled = false;

      // Reset UI states
      statusBadge.className = "status-badge";
      statusBadge.style.display = "none";
      lastDetectionData = null;

      // Render image preview
      const objectUrl = URL.createObjectURL(file);
      previewImg.src = objectUrl;

      // Clear previous canvas drawing
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      previewImg.onload = () => {
        canvasContainer.style.display = "flex";
        alignCanvasSize();
      };
    });

    // 2. Submit Image to FastAPI Backend
    submitBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) return;

      // Update UI state
      submitBtn.disabled = true;
      setStatus("Analyzing image with YOLO26...", "loading");

      const formData = new FormData();
      formData.append("file", file);

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: formData,
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.detail || `Server Error (${response.status})`);
        }

        const data = await response.json();

        if (data.status === "success") {
          lastDetectionData = data;
          setStatus(`Detected: ${data.pill_count} Pill(s)`, "success");
          
          // Render bounding boxes on Canvas
          drawBoxes(data.boxes, data.image_size);
        } else {
          setStatus("Detection failed. Please try again.", "error");
        }
      } catch (err) {
        console.error("API Error:", err);
        setStatus(`Error: ${err.message}`, "error");
      } finally {
        submitBtn.disabled = false;
      }
    });

    // 3. Draw Bounding Boxes on Canvas
    function drawBoxes(boxes, originalSize) {
      if (!boxes || !originalSize) return;

      const ctx = canvas.getContext("2d");

      // Ensure canvas pixels perfectly align with the displayed image dimensions
      alignCanvasSize();

      const displayWidth = previewImg.clientWidth;
      const displayHeight = previewImg.clientHeight;

      // Calculate ratio between displayed size and original image dimensions
      const scaleX = displayWidth / originalSize.width;
      const scaleY = displayHeight / originalSize.height;

      // Canvas Style Configurations
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#00FF00"; // Bright green bounding box
      ctx.lineWidth = Math.max(2, Math.round(displayWidth / 200)); // Responsive line width
      ctx.fillStyle = "#00FF00";
      ctx.font = `bold ${Math.max(12, Math.round(displayWidth / 35))}px sans-serif`;

      // Iterate over each detection box [x1, y1, x2, y2]
      boxes.forEach((item) => {
        const [x1, y1, x2, y2] = item.box;

        // Scale coordinates to fit screen display
        const scaledX1 = x1 * scaleX;
        const scaledY1 = y1 * scaleY;
        const boxWidth = (x2 - x1) * scaleX;
        const boxHeight = (y2 - y1) * scaleY;

        // Draw Bounding Box Rectangle
        ctx.strokeRect(scaledX1, scaledY1, boxWidth, boxHeight);

        // Draw Class Label & Confidence Score
        const labelText = `${item.label} ${Math.round(item.confidence * 100)}%`;
        const textY = scaledY1 > 20 ? scaledY1 - 6 : scaledY1 + 18;
        ctx.fillText(labelText, scaledX1 + 2, textY);
      });
    }

    // Helper: Match Canvas dimensions with Image CSS Display dimensions
    function alignCanvasSize() {
      canvas.width = previewImg.clientWidth;
      canvas.height = previewImg.clientHeight;
    }

    // Helper: Set Status Badge Message
    function setStatus(message, type) {
      statusBadge.textContent = message;
      statusBadge.className = `status-badge ${type}`;
    }

    // 4. Redraw Bounding Boxes on Screen Resize or Device Reorientation
    window.addEventListener("resize", () => {
      if (lastDetectionData) {
        drawBoxes(lastDetectionData.boxes, lastDetectionData.image_size);
      } else {
        alignCanvasSize();
      }
    });
  </script>
</body>
</html>
