<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- 💡 防止瀏覽器快取 HTML，確保每次開啟都是最新版本 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>藥丸自動計數器</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .card {
      background-color: var(--card);
      width: 100%;
      max-width: 480px;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    /* 上傳區域 */
    .file-dropzone {
      position: relative;
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 1.5rem 1rem;
      background-color: #f1f5f9;
      cursor: pointer;
      margin-bottom: 1rem;
      transition: all 0.2s ease;
    }

    .file-dropzone:hover {
      border-color: var(--primary);
      background-color: #eff6ff;
    }

    .file-dropzone input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .file-label {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .file-label strong {
      display: block;
      color: var(--text);
      font-size: 1rem;
      margin-top: 0.25rem;
    }

    /* 按鈕 */
    .btn {
      background-color: var(--primary);
      color: #fff;
      border: none;
      width: 100%;
      padding: 0.85rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    /* 相片預覽 */
    .preview-box {
      margin-top: 1.5rem;
      display: none;
      border-radius: 8px;
      overflow: hidden;
      max-height: 250px;
    }

    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 顯示結果卡片 */
    .result-card {
      margin-top: 1.5rem;
      padding: 1.25rem;
      border-radius: 12px;
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      display: none;
    }

    .result-card.loading {
      display: block;
      background-color: #f0f9ff;
      border-color: #bae6fd;
      color: #0369a1;
    }

    .result-card.error {
      display: block;
      background-color: #fef2f2;
      border-color: #fecaca;
      color: #b91c1c;
    }

    .result-card.success {
      display: block;
    }

    .result-number {
      font-size: 2.5rem;
      font-weight: 800;
      color: #15803d;
      line-height: 1.2;
    }

    .result-label {
      font-size: 0.9rem;
      color: #166534;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>藥丸自動計數器</h1>
    <p class="subtitle">上傳或拍攝藥丸相片，即時計算數量</p>

    <div class="file-dropzone">
      <input type="file" id="file-input" accept="image/*" />
      <div class="file-label" id="file-label">
        📷 <span>點擊上傳或拍照</span>
        <strong id="file-name">未選擇檔案</strong>
      </div>
    </div>

    <button class="btn" id="submit-btn" disabled>開始計算數量</button>

    <!-- 圖片預覽 -->
    <div class="preview-box" id="preview-box">
      <img id="preview-img" alt="藥丸預覽" />
    </div>

    <!-- 結果顯示區 -->
    <div class="result-card" id="result-card">
      <div id="result-content"></div>
    </div>
  </div>

  <script>
    // 💡 記得替換成你 Render 部署成功後的 URL
    const API_URL = "https://your-render-app.onrender.com/count";

    const fileInput = document.getElementById("file-input");
    const fileName = document.getElementById("file-name");
    const submitBtn = document.getElementById("submit-btn");
    const previewBox = document.getElementById("preview-box");
    const previewImg = document.getElementById("preview-img");
    const resultCard = document.getElementById("result-card");
    const resultContent = document.getElementById("result-content");

    // 1. 選擇圖片預覽
    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      fileName.textContent = file.name;
      submitBtn.disabled = false;

      // 預覽圖片
      previewImg.src = URL.createObjectURL(file);
      previewBox.style.display = "block";

      // 隱藏之前的結果
      resultCard.className = "result-card";
      resultCard.style.display = "none";
    });

    // 2. 發送至 FastAPI 後端
    submitBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) return;

      submitBtn.disabled = true;
      showLoading("正在分析藥丸數量...");

      const formData = new FormData();
      formData.append("file", file);

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: formData,
        });

        if (!response.ok) {
          throw new Error(`伺服器回應錯誤 (${response.status})`);
        }

        const data = await response.json();

        if (data.status === "success") {
          showSuccess(data.pill_count);
        } else {
          showError("計算失敗，請再試一次。");
        }
      } catch (err) {
        console.error(err);
        showError(`發生錯誤: ${err.message}`);
      } finally {
        submitBtn.disabled = false;
      }
    });

    // 顯示 Loading
    function showLoading(msg) {
      resultCard.className = "result-card loading";
      resultContent.innerHTML = `<p style="font-weight:600;">${msg}</p>`;
    }

    // 顯示結果 (大數字)
    function showSuccess(count) {
      resultCard.className = "result-card success";
      resultContent.innerHTML = `
        <div class="result-number">${count}</div>
        <div class="result-label">偵測到的藥丸總數 (粒)</div>
      `;
    }

    // 顯示錯誤
    function showError(msg) {
      resultCard.className = "result-card error";
      resultContent.innerHTML = `<p style="font-weight:600;">${msg}</p>`;
    }
  </script>
</body>
</html>
